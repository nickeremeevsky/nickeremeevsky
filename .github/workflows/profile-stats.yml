name: Update profile statistics
on:
  workflow_dispatch:
  schedule:
    - cron: '21 5 * * 1'
permissions:
  contents: write
concurrency:
  group: profile-stats
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'nickeremeevsky/nickeremeevsky' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Generate local SVGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_stats.py
      - name: Commit changed statistics only
        run: |
          git add -- assets/stats/languages-light.svg assets/stats/languages-dark.svg assets/stats/contributions-light.svg assets/stats/contributions-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update profile statistics'
          git push origin HEAD:main
